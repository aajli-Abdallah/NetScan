spring.application.name=NetScan
spring.threads.virtual.enabled=true
# Safe default: API only reachable from this machine (no login until 1.0.5)
server.address=127.0.0.1
server.port=8080
netscan.timeout-ms=300
netscan.probe-ports=80,443,22,53,445
netscan.cache-seconds=10

# Persistence (1.0.1)
spring.datasource.url=jdbc:h2:file:./data/netscan
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true

# Scheduling and history (1.0.2)
netscan.scheduler.enabled=true
netscan.scan-interval=PT5M
netscan.scan-initial-delay=PT20S
netscan.offline-after-misses=2
netscan.events-retention-days=90

# Enrichment (1.0.3)
netscan.oui-file=./data/oui.csv
netscan.hostname-timeout-ms=2000
netscan.portscan-timeout-ms=500
netscan.quick-ports=21,22,23,53,80,139,443,445,554,631,1883,3389,5900,8080,8443,9100
server.error.include-message=always

# Alerts (1.0.4) - optional push to your phone. Empty = off.
# Prefer the env var NETSCAN_ALERT_WEBHOOK_URL for secrets. Formats: text, discord, telegram, slack
netscan.alert.webhook-url=
netscan.alert.webhook-format=text

# Security and backup (1.0.5)
netscan.security.username=admin
# Empty = random password generated on first start (logged once), stored hashed in the hash file.
# To choose your own use the env var NETSCAN_SECURITY_PASSWORD. Never commit passwords.
netscan.security.password=
netscan.security.hash-file=./data/admin.hash
netscan.backup.enabled=true
netscan.backup.dir=./data/backups
netscan.backup.keep=14
server.servlet.session.cookie.same-site=lax
